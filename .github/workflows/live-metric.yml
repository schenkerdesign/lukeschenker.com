# Nightly refresh of the SHRP "hours saved" number shown on the homepage and the SHRP case study.
# Calls the shrp-prod live-metric function (URL + token are repo secrets), commits
# assets/data/live-metric.json if it changed, then requests a Pages build: pushes made with
# GITHUB_TOKEN do not trigger one on their own (GitHub docs), but `pages: write` lets the job ask.
# Free: GitHub Actions minutes are free for public repos on standard runners.
name: Live metric

on:
  schedule:
    - cron: '20 6 * * *' # 06:20 UTC: after midnight ET and Singapore, so yesterday is complete
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: live-metric
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the number
        env:
          LIVE_METRIC_URL: ${{ secrets.LIVE_METRIC_URL }}
          LIVE_METRIC_TOKEN: ${{ secrets.LIVE_METRIC_TOKEN }}
        run: .github/scripts/fetch-live-metric.sh

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- assets/data/live-metric.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Live metric: $(jq -r '.updated' assets/data/live-metric.json)" -- assets/data/live-metric.json
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
