<!DOCTYPE html>
<!--
    Password gate for the protected case studies (the PAGES in the encrypt script), a custom StatiCrypt 3.5.4 template
    (Luke 2026-10-27/28). _tools/encrypt-case-studies.mjs fills the {{...}} tokens, then StatiCrypt fills its
    /*[|...|]*/0 placeholders: keep those intact, including the trailing 0 (StatiCrypt README).
    The gate UI is /assets/js/case-study-gate.js (the same one the homepage modal uses); this page shows it when
    there's no remembered password. On the right password StatiCrypt replaces this whole document with the
    decrypted page (document.write). The password is always remembered in this browser [Luke 2026-10-28].
-->
<html lang="en" class="dark staticrypt-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/*[|template_title|]*/0</title>

    <!-- do not cache this page (from StatiCrypt's default template) -->
    <meta http-equiv="cache-control" content="max-age=0">
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">

    <!-- From the page's own <head>: link previews, favicons, stylesheets, fonts, icons. The served HTML is this gate,
         so these have to live here or the page would lose its link preview. -->
{{HEAD}}
    <link rel="stylesheet" href="/assets/css/case-study-gate.css?v={{VERSION}}">

    <style>
        /* Black while StatiCrypt checks for a remembered password, so returning visitors don't see the gate flash */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #050505;
        }
    </style>
</head>
<body class="{{BODY_CLASS}}">
    <!-- This page's gate content, written by the encrypt script from the page itself -->
    <script id="case-study-gate" type="application/json">{{GATE_JSON}}</script>

    <!-- StatiCrypt's settings (ciphertext + salt). The homepage modal reads them from here to check a password. -->
    <script id="staticrypt-config" type="application/json">/*[|staticrypt_config|]*/0</script>

    <!-- StatiCrypt's engine. The encrypt script also copies this block to /assets/js/staticrypt-engine.js for the modal. -->
    <script id="staticrypt-engine">
        window.staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    </script>

    <script src="/assets/js/video-scrub.js?v={{VERSION}}"></script>
    <script src="/assets/js/copy-email.js?v={{VERSION}}"></script>
    <script src="/assets/js/case-study-gate.js?v={{VERSION}}"></script>
    <script>
        const staticrypt = window.staticryptInitiator.init(
            JSON.parse(document.getElementById("staticrypt-config").textContent),
            {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            }
        );

        // A remembered password opens the page straight away; otherwise show the gate.
        window.onload = async function () {
            const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
            if (isSuccessful) return;
            const gate = JSON.parse(document.getElementById("case-study-gate").textContent);
            window.CaseStudyGate.render(
                gate,
                "page",
                async (password) => (await staticrypt.handleDecryptionOfPage(password, true)).isSuccessful,
                () => { window.location.href = "/"; }
            );
        };
    </script>
</body>
</html>
